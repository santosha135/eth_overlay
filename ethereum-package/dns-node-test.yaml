apiVersion: v1
kind: Pod
metadata:
  name: dns-test-santosh
spec:
  nodeName: santosh
  restartPolicy: Never
  containers:
    - name: bb
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: dns-test-localhost
spec:
  nodeName: localhost.localdomain
  restartPolicy: Never
  containers:
    - name: bb
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
